steps:
  # ── Build Docker image ──
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_IMAGE}'
      - '.'

  # ── Push to Artifact Registry ──
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE}']

# ── Run database migrations ──
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run jobs deploy backend-migrate \
          --image=${_IMAGE} \
          --region=${_REGION} \
          --set-env-vars="MIGRATE_ONLY=true,ENV=prod,DB_CONNECTION=mysql,DB_USER=${_DB_USER},DB_NAME=${_DB_NAME},DB_SOCKET=/cloudsql/${_CLOUD_SQL_CONNECTION},CLIENT_URL=${_CLIENT_URL}" \
          --set-secrets="DB_PASS=db-password:latest,TOKEN_ENCRYPTION_KEY=token-encryption-key:latest" \
          --set-cloudsql-instances=${_CLOUD_SQL_CONNECTION} \
          --service-account=${_CR_SA} \
          --wait \
          --execute-now

  # ── Deploy to Cloud Run ──
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'backend'
      - '--image=${_IMAGE}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--add-cloudsql-instances=${_CLOUD_SQL_CONNECTION}'
      - '--service-account=${_CR_SA}'
      - '--set-env-vars'
      - 'ENV=prod,DB_CONNECTION=mysql,DB_USER=${_DB_USER},DB_NAME=${_DB_NAME},DB_SOCKET=/cloudsql/${_CLOUD_SQL_CONNECTION},CLIENT_URL=${_CLIENT_URL},REDIRECT_URL=${_REDIRECT_URL},COOKIE_DOMAIN=${_COOKIE_DOMAIN},CROSS_ORIGIN=${_CROSS_ORIGIN},CONFIG_PATH=config.yaml'
      - '--set-secrets'
      - 'DB_PASS=db-password:latest,JWT_SECRET=jwt-secret:latest,GOOGLE_CLIENT_ID=google-client-id:latest,GOOGLE_CLIENT_SECRET=google-client-secret:latest,TOKEN_ENCRYPTION_KEY=token-encryption-key:latest'

substitutions:
  _REGION: 'europe-west2'
  _IMAGE: '${_REGION}-docker.pkg.dev/${PROJECT_ID}/life-dashboard/backend:${SHORT_SHA}'
  _CLOUD_SQL_CONNECTION: 'life-dashboard-413916:europe-west2:life-dashboard-db' 
  _DB_USER: 'app'                                                         
  _DB_NAME: 'life_dashboard'                                              
  _CR_SA: '835639357459-compute@developer.gserviceaccount.com'
  _CLIENT_URL: 'https://frontend-835639357459.europe-west2.run.app'                      
  # _REDIRECT_URL: 'https://backend-835639357459.europe-west2.run.app/api/auth/google-callback' 
  _REDIRECT_URL: 'https://frontend-835639357459.europe-west2.run.app/api/auth/google-callback' 
  # _CROSS_ORIGIN: 'true'
  _CROSS_ORIGIN: 'false'

images:
  - '${_IMAGE}'

options:
  logging: CLOUD_LOGGING_ONLY