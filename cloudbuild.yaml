steps:
  # ── Build Docker image ──
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_IMAGE}'
      - '.'

  # ── Push to Artifact Registry ──
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE}']

  # ── Run database migrations (as a one-off Cloud Run job) ──
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run jobs replace - <<EOF
        apiVersion: run.googleapis.com/v1
        kind: Job
        metadata:
          name: backend-migrate
          labels:
            cloud.googleapis.com/location: ${_REGION}
        spec:
          template:
            spec:
              template:
                spec:
                  containers:
                    - image: ${_IMAGE}
                      env:
                        - name: MIGRATE_ONLY
                          value: "true"
                        - name: ENV
                          value: "prod"
                        - name: DB_CONNECTION
                          value: "mysql"
                        - name: DB_USER
                          value: "${_DB_USER}"
                        - name: DB_NAME
                          value: "${_DB_NAME}"
                        - name: DB_SOCKET
                          value: "/cloudsql/${_CLOUD_SQL_CONNECTION}"
                        - name: DB_PASS
                          valueFrom:
                            secretKeyRef:
                              name: db-password
                              key: latest
                        - name: CONFIG_PATH
                          value: "config.yaml"
                  serviceAccountName: ${_CR_SA}
              metadata:
                annotations:
                  run.googleapis.com/cloudsql-instances: ${_CLOUD_SQL_CONNECTION}
        EOF
        gcloud run jobs execute backend-migrate \
          --region=${_REGION} --wait

  # ── Deploy to Cloud Run ──
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'backend'
      - '--image=${_IMAGE}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--add-cloudsql-instances=${_CLOUD_SQL_CONNECTION}'
      - '--service-account=${_CR_SA}'
      - '--set-env-vars'
      - 'ENV=prod,DB_CONNECTION=mysql,DB_USER=${_DB_USER},DB_NAME=${_DB_NAME},DB_SOCKET=/cloudsql/${_CLOUD_SQL_CONNECTION},CLIENT_URL=${_CLIENT_URL},REDIRECT_URL=${_REDIRECT_URL},COOKIE_DOMAIN=${_COOKIE_DOMAIN},CROSS_ORIGIN=${_CROSS_ORIGIN},CONFIG_PATH=config.yaml'
      - '--set-secrets'
      - 'DB_PASS=db-password:latest,JWT_SECRET=jwt-secret:latest,GOOGLE_CLIENT_ID=google-client-id:latest,GOOGLE_CLIENT_SECRET=google-client-secret:latest,TOKEN_ENCRYPTION_KEY=token-encryption-key:latest'

substitutions:
  _REGION: 'europe-west2'
  _IMAGE: '${_REGION}-docker.pkg.dev/${PROJECT_ID}/life-dashboard/backend:${SHORT_SHA}'
  _CLOUD_SQL_CONNECTION: 'life-dashboard-413916:europe-west2:life-dashboard-db' 
  _DB_USER: 'app'                                                         
  _DB_NAME: 'life_dashboard'                                              
  _CR_SA: ''    # filled automatically or override
  _CLIENT_URL: 'https://YOUR-FRONTEND-URL.run.app'                        # ← update after first FE deploy
  _REDIRECT_URL: 'https://YOUR-BACKEND-URL.run.app/api/auth/google/callback'  # ← update after first BE deploy
  _COOKIE_DOMAIN: ''
  _CROSS_ORIGIN: 'true'

images:
  - '${_IMAGE}'

options:
  logging: CLOUD_LOGGING_ONLY